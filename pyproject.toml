[project]
name = "civicpulse"
version = "0.1.0"
description = "CivicPulse - Smart City Issue Reporting & Resolution Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.1",
    "Flask-Login>=0.6.3",
    "Werkzeug>=3.0.0",
    "pytest>=8.0.0",
    "Pillow>=10.0.0",
    "gunicorn>=21.2.0",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["instance*", "tests*"]

[tool.vercel]
entrypoint = "run:app"
