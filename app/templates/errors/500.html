{% extends 'base.html' %}
{% block title %}500 Internal Error — CivicPulse{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card card-civic p-4 shadow-sm border-warning">
        <div class="display-1 text-warning fw-bold"><i class="bi bi-exclamation-triangle"></i></div>
        <h3 class="fw-bold text-navy mt-3">Internal Server Error (500)</h3>
        <p class="text-muted mt-2">
          An unexpected issue occurred while processing your request. The transaction has been rolled back safely.
        </p>
        <div class="d-flex justify-content-center gap-2 mt-4">
          <a href="{{ url_for('main.index') }}" class="btn btn-civic-teal">Return to Homepage</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
