{% extends 'base.html' %}
{% block title %}404 Not Found — CivicPulse{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card card-civic p-4 shadow-sm">
        <div class="display-1 text-teal fw-bold" style="color: var(--cp-teal);"><i class="bi bi-geo-alt-fill"></i></div>
        <h3 class="fw-bold text-navy mt-3">Page Not Found (404)</h3>
        <p class="text-muted mt-2">
          The civic resource, report tracking ID, or route you are searching for does not exist or has been relocated.
        </p>
        <div class="d-flex justify-content-center gap-2 mt-4">
          <a href="{{ url_for('main.index') }}" class="btn btn-civic-teal">Return to Homepage</a>
          <a href="{{ url_for('main.explore') }}" class="btn btn-civic-outline">Explore City Map</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
