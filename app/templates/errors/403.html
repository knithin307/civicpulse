{% extends 'base.html' %}
{% block title %}403 Forbidden — CivicPulse{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card card-civic p-4 shadow-sm border-danger">
        <div class="display-1 text-danger fw-bold"><i class="bi bi-shield-x"></i></div>
        <h3 class="fw-bold text-navy mt-3">Access Restricted (403)</h3>
        <p class="text-muted mt-2">
          You do not have the required role or municipal authorization to access this administrative portal.
        </p>
        <div class="d-flex justify-content-center gap-2 mt-4">
          <a href="{{ url_for('main.index') }}" class="btn btn-civic-outline">Go Home</a>
          <a href="{{ url_for('auth.login') }}" class="btn btn-civic-teal">Switch Account</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
